# ==============================================================================
# PIPELINE HELLO WORLD CƠ BẢN TRONG GITLAB CI/CD
# ==============================================================================
# 💡 GHI CHÚ QUAN TRỌNG VỀ CƠ CHẾ KÍCH HOẠT (TRIGGER & RULES):
# - Khi KHÔNG khai báo `rules:` hay `if:`, hành vi mặc định của GitLab CI là:
#   Job sẽ TỰ ĐỘNG KÍCH HOẠT trên MỌI NHÁNH với bất kỳ sự kiện `git push` nào!
#   (Ngầm định: `only: [branches, tags]` và `when: on_success`).
# - Bạn chỉ cần thêm `rules: - if: ...` khi muốn kiểm soát điều kiện:
#   + Chỉ định nhánh cụ thể (ví dụ: chỉ chạy deploy trên nhánh main).
#   + Ngăn chặn duplicate pipelines giữa Branch Push và Merge Request Event.
#   + Chạy theo Git Tag, Lịch định kỳ (Schedule), hoặc kích hoạt thủ công (Manual).
# ==============================================================================

stages:
  - test
  - build

hello_job:
  stage: test
  image: alpine:latest
  script:
    - echo "Xin chào từ GitLab CI/CD!"
    - echo "Job đang chạy trên Runner với Docker container Alpine"
    - uname -a

build_mock:
  stage: build
  image: alpine:latest
  script:
    - echo "Giả lập bước đóng gói ứng dụng..."
    - 'echo "Commit SHA hiện tại là: $CI_COMMIT_SHORT_SHA"'

