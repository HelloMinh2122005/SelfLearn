apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: default
  annotations:
    kubernetes.io/change-cause: "First release hello-service v1.0.0"
  labels:
    app.kubernetes.io/name: hello-service
spec:
  revisionHistoryLimit: 10 # Keep at most 10 old ReplicaSets for rollback
  minReadySeconds: 10      # New Pod must be Ready for 10 seconds before considered "available"
  progressDeadlineSeconds: 600 # Rollback process at most 600 seconds
  strategy: # Define on how we will rollback
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  replicas: 4 # 4 Pods
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-service
  template: # start define the pod template
    metadata:
      labels:
        app.kubernetes.io/name: hello-service
    spec:
      containers:
        - name: hello-app
          image: hashicorp/http-echo
          args: ["-text=hello v1", "-listen=:5678"]
          ports:
            - containerPort: 5678
              name: http
          readinessProbe:
            httpGet: { path: /, port: http }

---

apiVersion: v1
kind: Service
metadata:
  name: hello-service
spec:
  type: NodePort # Blank means Cluster IP
  selector:
    app.kubernetes.io/name: hello-service
  ports:
    - name: http
      targetPort: http
      port: 80
      nodePort: 30080  # Optional: Blank means random between 30000-32767

---

# GatewayClass
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

# Gateways
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hello-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http # Create a gate, accept inbound in port 80
      protocol: HTTP
      port: 80

# HTTPRoutes
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-backend-route #  "Route này chỉ nhận request có Host: www.hello.com. Request mang Host khác thì không khớp."
                            #   curl --header "Host: www.hello.com" http://<địa-chỉ-gateway>/
spec:
  parentRefs:
    - name: hello-gateway # Put this route in the gateway name eg
  hostnames:
    - "www.hello.com"
  rules:
    - backendRefs: # Destination
      - group: ""  # Core group of K8S, this is where Service stays
        kind: Service # Destination is the Service
        name: hello-service # Name of the Service
        port: 80
        weight: 1 # Weight for traffic
      matches:    # Request needs to match this
        - path:
          type: PathPrefix # Longest prefix match
          value: / # All path allow
